  <g transform="translate(104 842)" font-family="Arial, sans-serif">
    <text x="0" y="0" fill="#111315" font-size="24" font-weight="700" letter-spacing="4">FOLD AND FINISH NOTES</text>
    <text x="0" y="42" fill="#56524B" font-size="17">Score envelope flap before liner glue. Keep yellow stock unlaminated so the invitation still feels like paper.</text>
    <rect x="0" y="88" width="512" height="76" fill="#F8BA00"/>
    <rect x="512" y="88" width="316" height="76" fill="#111315"/>
    <rect x="828" y="88" width="316" height="76" fill="#F4F1EA" stroke="#111315" stroke-opacity="0.2"/>
