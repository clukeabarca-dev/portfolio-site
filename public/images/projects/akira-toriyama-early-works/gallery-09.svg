<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="stockNoise" x="0" y="0" width="1600" height="1100" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.58" numOctaves="4" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="paperBg" x1="0" y1="0" x2="1600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFAF6"/>
      <stop offset="1" stop-color="#E7E0D3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#paperBg)"/>
  <rect width="1600" height="1100" filter="url(#stockNoise)"/>
  <text x="80" y="120" fill="#111315" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">PAPER STUDIES</text>
  <text x="80" y="190" fill="#111315" font-family="Georgia, serif" font-size="76">Invitation stock and tactile tests</text>
  <text x="80" y="235" fill="#56524B" font-family="Arial, sans-serif" font-size="19">Material notes for the enclosed letter, RSVP card, envelope liner, and visitor badge set.</text>
  <g transform="translate(82 312)" font-family="Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="276" height="432" rx="8" fill="#F8BA00"/>
      <rect x="18" y="18" width="240" height="396" rx="5" stroke="#FFF8DC" stroke-opacity="0.62"/>
      <text x="28" y="72" fill="#111315" font-size="18" font-weight="700" letter-spacing="3">COVER SHEET</text>
      <text x="28" y="128" fill="#111315" font-size="52" font-weight="700">120 lb</text>
      <text x="28" y="172" fill="#111315" font-size="18">Smooth uncoated yellow</text>
      <path d="M32 278H244M32 306H244M32 334H178" stroke="#111315" stroke-opacity="0.34" stroke-width="4"/>
      <text x="28" y="384" fill="#111315" font-size="15" opacity="0.72">Holds dense black type without glare.</text>
    </g>
    <g transform="translate(310 54)">
      <rect x="0" y="0" width="276" height="432" rx="8" fill="#111315"/>
      <path d="M0 0L276 0L138 116Z" fill="#090A0B"/>
      <text x="28" y="72" fill="#F8BA00" font-size="18" font-weight="700" letter-spacing="3">ENVELOPE LINER</text>
      <text x="28" y="128" fill="#F4F1EA" font-size="52" font-weight="700">Matte</text>
      <text x="28" y="172" fill="#F4F1EA" font-size="18" opacity="0.78">Carbon black interior</text>
      <path d="M32 276H244M32 304H244M32 332H178" stroke="#F8BA00" stroke-opacity="0.48" stroke-width="4"/>
      <text x="28" y="384" fill="#F4F1EA" font-size="15" opacity="0.72">Turns the mailer into the first reveal.</text>
    </g>
    <g transform="translate(620 0)">
      <rect x="0" y="0" width="276" height="432" rx="8" fill="#F4F1EA" stroke="#111315" stroke-opacity="0.18"/>
      <rect x="28" y="36" width="220" height="116" fill="#FBFAF6" stroke="#111315" stroke-opacity="0.18"/>
      <text x="28" y="214" fill="#111315" font-size="18" font-weight="700" letter-spacing="3">RSVP LETTER</text>
      <text x="28" y="270" fill="#111315" font-size="52" font-weight="700">96 lb</text>
      <text x="28" y="314" fill="#56524B" font-size="18">Soft white writing sheet</text>
      <path d="M32 360H244M32 388H206" stroke="#111315" stroke-opacity="0.22" stroke-width="4"/>
    </g>
    <g transform="translate(930 54)">
      <rect x="0" y="0" width="276" height="432" rx="8" fill="#D7D2C8"/>
      <rect x="30" y="34" width="216" height="322" rx="16" fill="#F4F1EA" stroke="#111315" stroke-opacity="0.24"/>
      <rect x="48" y="54" width="180" height="282" rx="8" fill="#F8BA00"/>
      <text x="30" y="396" fill="#111315" font-size="18" font-weight="700" letter-spacing="3">BADGE BACKER</text>
      <text x="30" y="426" fill="#56524B" font-size="15">Satin gray board with yellow front.</text>
    </g>
